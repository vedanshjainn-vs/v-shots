name: Home Fix

'on':
  push:
    branches:
      - feature/home-archivetune-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tiny Home fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/polish/premium_archive_home_screen.dart')
          s = p.read_text()
          s = s.replace('fetched[shelf.query] ?? const []', 'fetched[shelf.query] ?? const <Map<String, dynamic>>[]')
          s = s.replace('_CircleButton(icon: Icons.notifications_none_rounded),', 'const _CircleButton(icon: Icons.notifications_none_rounded),')
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/polish/premium_archive_home_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(home): resolve analyzer typing"
          git push origin HEAD:feature/home-archivetune-v2
          echo "Home analyzer fix applied; PR validation will run on this commit."
