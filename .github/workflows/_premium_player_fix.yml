          old = '''        return 'unmute-target|' + String(targetX) + '|' + String(targetY);'''
          new = '''        return 'muted-content';'''
          if old not in s: raise SystemExit('native unmute JS marker not found')
          s = s.replace(old, new, 1)

          # Replace the native unmute-target branch with a state-only branch.
