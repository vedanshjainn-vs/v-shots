name: V Shots Premium Player Stabilization

on:
  push:
    branches:
      - feat/production-upgrade
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premium-player:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/production-upgrade
          fetch-depth: 0

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Environment
        run: touch .env

      - name: Dependencies
        run: flutter pub get

      - name: Apply source patch
        run: python3 tooling/premium_player_patch.py

      - name: Format
        run: dart format lib test

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Validate outputs
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated source and remove patch runner
        run: |
          rm -f .env tooling/premium_player_patch.py .github/workflows/_premium_player_fix.yml
          git config user.name "V Shots Agent"
          git config user.email "agent@arena.ai"
          git add lib/features/foryou/discovery_browser_controller.dart lib/features/foryou/vshots_browser_session.dart lib/features/foryou/discovery_browser_sheet.dart android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt tooling/premium_player_patch.py .github/workflows/_premium_player_fix.yml
          git commit -m "feat(player): stabilize premium WebView playback" || exit 0
          git push origin HEAD:feat/production-upgrade
