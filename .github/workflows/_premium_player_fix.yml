name: V Shots Premium Player Stabilization

on:
  push:
    branches: [feat/production-upgrade]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  premium-player:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-upgrade
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Prepare validation environment
        run: touch .env

      - name: Install dependencies
        run: flutter pub get

      - name: Apply premium player + playback patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: marker not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # ---------------------------------------------------------------
          # Controller: official YouTube embed URL + explicit audio state.
          # ---------------------------------------------------------------
          p = 'lib/features/foryou/discovery_browser_controller.dart'
          s = read(p)
          s = s.replace(
              '  bool _adActive = false;\n',
              '  bool _adActive = false;\n  bool _audioMutedContent = false;\n', 1)
          s = s.replace(
              '  bool get adActive => _adActive;\n',
              '  bool get adActive => _adActive;\n  bool get audioMutedContent => _audioMutedContent;\n', 1)
          s = s.replace(
              '    _adActive = false;\n    debugPrint(\'[DiscoveryBrowser] OPEN videoId=${track[\'id\']} url=$url\');',
              '    _adActive = false;\n    _audioMutedContent = false;\n    debugPrint(\'[DiscoveryBrowser] OPEN videoId=${track[\'id\']} url=$url\');', 1)
          s = s.replace(
              '    _adActive = false;\n    _track = null;\n',
              '    _adActive = false;\n    _audioMutedContent = false;\n    _track = null;\n', 1)
          old_url = '''  String? get url {\n    final resolvedUrl = _track?['url'] as String?;\n    if (resolvedUrl != null && resolvedUrl.isNotEmpty) return resolvedUrl;\n    final id = videoId;\n    if (id == null || id.isEmpty) return null;\n    return youtubeWatchUrl(id);\n  }'''
          new_url = '''  String? get url {\n    final resolvedUrl = _track?['url'] as String?;\n    final resolvedId = resolvedUrl == null ? null : extractYoutubeVideoId(resolvedUrl);\n    final id = resolvedId ?? videoId;\n    if (id == null || id.isEmpty) {\n      return resolvedUrl != null && resolvedUrl.isNotEmpty ? resolvedUrl : null;\n    }\n    // Use the official YouTube embedded player for a substantially lighter\n    // page than the full watch UI while preserving YouTube controls/content.\n    // The native WebView remains the sole playback engine.\n    return 'https://www.youtube.com/embed/$id?autoplay=1&playsinline=1&controls=1&rel=0&enablejsapi=1';\n  }'''
          if old_url not in s:
              raise SystemExit('controller URL marker not found')
          s = s.replace(old_url, new_url, 1)
          marker = '''  void setAdActive(bool value) {\n    if (_adActive == value) return;\n    _adActive = value;\n    debugPrint('[DiscoveryBrowser] adActive=$value');\n    notifyListeners();\n  }'''
          addition = marker + '''\n\n  void setAudioState(String state) {\n    final muted = state == 'playing_muted_content';\n    if (_audioMutedContent == muted) return;\n    _audioMutedContent = muted;\n    notifyListeners();\n  }'''
          if marker not in s:
              raise SystemExit('controller ad marker not found')
          s = s.replace(marker, addition, 1)
          write(p, s)

          # ---------------------------------------------------------------
          # Session: native audio-state event + explicit unmute/play command.
          # ---------------------------------------------------------------
          p = 'lib/features/foryou/vshots_browser_session.dart'
          s = read(p)
          s = s.replace(
              '    this.onPlaybackStateChanged,\n    this.onNotificationAction,',
              '    this.onPlaybackStateChanged,\n    this.onAudioStateChanged,\n    this.onNotificationAction,', 1)
          s = s.replace(
              '  final void Function(VShotsPlaybackState state, bool playing)?\n      onPlaybackStateChanged;\n\n  final Future<void> Function(String action)? onNotificationAction;',
              '  final void Function(VShotsPlaybackState state, bool playing)?\n      onPlaybackStateChanged;\n\n  final void Function(String state)? onAudioStateChanged;\n\n  final Future<void> Function(String action)? onNotificationAction;', 1)
          marker = '''  Future<void> play({bool userInitiated = true}) async {\n    if (userInitiated) {\n      _userPaused = false;\n    }\n    _autoplayPending = false;\n    final channel = _channel;\n    if (channel == null) return;\n    try {\n      await channel.invokeMethod<void>(\n        'play',\n        <String, Object?>{'generation': _generation},\n      );\n    } catch (_) {}\n  }'''
          addition = marker + '''\n\n  Future<void> unmuteAndPlay() async {\n    _userPaused = false;\n    _autoplayPending = false;\n    final channel = _channel;\n    if (channel == null) return;\n    try {\n      await channel.invokeMethod<void>(\n        'unmuteAndPlay',\n        <String, Object?>{'generation': _generation},\n      );\n    } catch (_) {}\n  }'''
          if marker not in s:
              raise SystemExit('session play marker not found')
          s = s.replace(marker, addition, 1)
          s = s.replace(
              '''      case 'adState':\n        onAdState?.call(call.arguments == true);\n        break;''',
              '''      case 'adState':\n        onAdState?.call(call.arguments == true);\n        break;\n      case 'audioState':\n        if (_isCurrentEvent(call.arguments)) {\n          final arguments = call.arguments;\n          final state = arguments is Map\n              ? arguments['state']?.toString() ?? ''\n              : arguments?.toString() ?? '';\n          if (state.isNotEmpty) onAudioStateChanged?.call(state);\n        }\n        break;''', 1)
          write(p, s)

          # ---------------------------------------------------------------
          # Premium UI: mini player + full player + explicit sound recovery.
          # ---------------------------------------------------------------
          p = 'lib/features/foryou/discovery_browser_sheet.dart'
          s = read(p)
          s = s.replace(
              '      onPlaybackStateChanged: widget.controller.setPlaybackState,\n      onError:',
              '      onPlaybackStateChanged: widget.controller.setPlaybackState,\n      onAudioStateChanged: widget.controller.setAudioState,\n      onError:', 1)

          mini_start = s.index('  Widget _buildMiniPlayer() {')
          mini_end = s.index('  // ── Expanded body', mini_start)
          mini = r'''  Widget _buildMiniPlayer() {
    final title = widget.controller.title ?? 'Playing video';
    final artist = widget.controller.artist ?? '';
    final artwork = widget.controller.artwork;
    final playing = widget.controller.pagePlaying == true;
    final muted = widget.controller.audioMutedContent;

    return GestureDetector(
      onVerticalDragStart: _onDragStart,
      onVerticalDragUpdate: _onDragUpdate,
      onVerticalDragEnd: _onDragEnd,
      onTap: () => _animateTo(1.0),
      child: Container(
        height: 72,
        decoration: BoxDecoration(
          gradient: const LinearGradient(
            begin: Alignment.centerLeft,
            end: Alignment.centerRight,
            colors: [Color(0xF20D101A), Color(0xF21A1227)],
          ),
          borderRadius: BorderRadius.circular(22),
          border: Border.all(color: Colors.white.withValues(alpha: 0.10)),
          boxShadow: const [
            BoxShadow(color: Colors.black54, blurRadius: 24, offset: Offset(0, 10)),
          ],
        ),
        padding: const EdgeInsets.fromLTRB(8, 8, 6, 8),
        child: Row(
          children: [
            ClipRRect(
              borderRadius: BorderRadius.circular(14),
              child: Stack(
                children: [
                  AppImage(artwork, width: 56, height: 56, fit: BoxFit.cover,
                      errorIconColor: AppColors.accent),
                  if (playing)
                    Positioned.fill(
                      child: DecoratedBox(
                        decoration: BoxDecoration(color: Colors.black.withValues(alpha: 0.18)),
                        child: const Center(child: AnimatedEqualizer(size: 18, color: Colors.white)),
                      ),
                    ),
                ],
              ),
            ),
            const SizedBox(width: 12),
            Expanded(
              child: Column(
                mainAxisAlignment: MainAxisAlignment.center,
                crossAxisAlignment: CrossAxisAlignment.start,
                children: [
                  Text(title, maxLines: 1, overflow: TextOverflow.ellipsis,
                      style: const TextStyle(color: Colors.white, fontSize: 13.5, fontWeight: FontWeight.w800)),
                  const SizedBox(height: 3),
                  Row(children: [
                    Flexible(child: Text(artist, maxLines: 1, overflow: TextOverflow.ellipsis,
                        style: const TextStyle(color: Colors.white60, fontSize: 11.5))),
                    if (muted) ...[
                      const SizedBox(width: 7),
                      const Icon(Icons.volume_off_rounded, size: 13, color: AppColors.accent),
                    ],
                  ]),
                ],
              ),
            ),
            IconButton(
              tooltip: muted ? 'Turn sound on' : (playing ? 'Pause' : 'Play'),
              onPressed: muted ? () => unawaited(_session.unmuteAndPlay()) : _togglePagePlayback,
              icon: Icon(
                muted ? Icons.volume_up_rounded : (playing ? Icons.pause_rounded : Icons.play_arrow_rounded),
                color: AppColors.accent,
                size: 28,
              ),
            ),
            IconButton(
              tooltip: 'Open player',
              onPressed: () => _animateTo(1.0),
              icon: const Icon(Icons.keyboard_arrow_up_rounded, color: Colors.white70, size: 25),
            ),
          ],
        ),
      ),
    );
  }

'''
          s = s[:mini_start] + mini + s[mini_end:]

          controls_pattern = re.compile(r'  Widget _buildExpandedControls\(\) \{.*?\n  Widget _buildError\(\) \{', re.S)
          controls = r'''  Widget _buildExpandedControls() {
    final mgr = VShotsPlaybackManager.instance;
    final track = widget.controller.track ?? const <String, dynamic>{};
    final title = (track['title'] as String?) ?? '';
    final artist = (track['artist'] as String?) ?? '';
    final trackId = (track['id'] as String?) ?? '';
    final isLiked = trackId.isNotEmpty && LocalLibrary.instance.isLiked(trackId);
    final playing = widget.controller.pagePlaying == true;
    final muted = widget.controller.audioMutedContent;

    Widget action(IconData icon, String label, VoidCallback onTap, {bool active = false}) {
      return Expanded(
        child: InkWell(
          borderRadius: BorderRadius.circular(16),
          onTap: onTap,
          child: Padding(
            padding: const EdgeInsets.symmetric(vertical: 8),
            child: Column(mainAxisSize: MainAxisSize.min, children: [
              Icon(icon, size: 20, color: active ? AppColors.accent : Colors.white70),
              const SizedBox(height: 4),
              Text(label, style: const TextStyle(color: Colors.white54, fontSize: 9, fontWeight: FontWeight.w600)),
            ]),
          ),
        ),
      );
    }

    return Container(
      decoration: const BoxDecoration(
        gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter,
            colors: [Color(0xFF111421), Color(0xFF080A10)]),
      ),
      padding: EdgeInsets.fromLTRB(16, 12, 16, MediaQuery.of(context).padding.bottom + 12),
      child: Column(mainAxisSize: MainAxisSize.min, children: [
        Row(children: [
          Expanded(child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
            Text(title, maxLines: 1, overflow: TextOverflow.ellipsis,
                style: const TextStyle(color: Colors.white, fontSize: 18, fontWeight: FontWeight.w900, letterSpacing: -0.3)),
            const SizedBox(height: 4),
            Row(children: [
              Flexible(child: Text(artist, maxLines: 1, overflow: TextOverflow.ellipsis,
                  style: const TextStyle(color: Colors.white60, fontSize: 12.5))),
              if (track['isOfficial'] == true) ...[
                const SizedBox(width: 6),
                const Icon(Icons.verified_rounded, size: 14, color: AppColors.accent),
              ],
            ]),
          ])),
          if (muted)
            FilledButton.icon(
              onPressed: () => unawaited(_session.unmuteAndPlay()),
              style: FilledButton.styleFrom(backgroundColor: AppColors.accent, foregroundColor: Colors.black,
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14))),
              icon: const Icon(Icons.volume_up_rounded, size: 17),
              label: const Text('Sound', style: TextStyle(fontWeight: FontWeight.w900, fontSize: 12)),
            )
          else
            IconButton(onPressed: _close, icon: const Icon(Icons.close_rounded, color: Colors.white60)),
        ]),
        const SizedBox(height: 12),
        Container(
          height: 54,
          decoration: BoxDecoration(color: Colors.white.withValues(alpha: 0.055), borderRadius: BorderRadius.circular(18),
              border: Border.all(color: Colors.white.withValues(alpha: 0.07))),
          child: Row(children: [
            action(mgr.isShuffleOn ? Icons.shuffle_on_rounded : Icons.shuffle_rounded, 'Shuffle', () => setState(mgr.toggleShuffle), active: mgr.isShuffleOn),
            action(Icons.skip_previous_rounded, 'Previous', mgr.previous),
            Expanded(child: Center(child: GestureDetector(
              onTap: () async { if (muted) { await _session.unmuteAndPlay(); } else { await _togglePagePlayback(); } if (mounted) setState(() {}); },
              child: Container(width: 46, height: 46, decoration: const BoxDecoration(shape: BoxShape.circle, gradient: AppColors.primaryGradient),
                  child: Icon(muted ? Icons.volume_up_rounded : (playing ? Icons.pause_rounded : Icons.play_arrow_rounded), color: Colors.white, size: 27)),
            ))),
            action(Icons.skip_next_rounded, 'Next', mgr.next),
            action(mgr.repeatMode == PlaybackRepeat.one ? Icons.repeat_one_rounded : Icons.repeat_rounded, 'Repeat', () => setState(mgr.cycleRepeat), active: mgr.repeatMode != PlaybackRepeat.off),
          ]),
        ),
        const SizedBox(height: 8),
        Container(
          padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 2),
          decoration: BoxDecoration(color: Colors.white.withValues(alpha: 0.035), borderRadius: BorderRadius.circular(16)),
          child: Row(children: [
            action(isLiked ? Icons.favorite_rounded : Icons.favorite_border_rounded, 'Like', () async {
              final wasLiked = isLiked;
              await LocalLibrary.instance.toggleLiked(track);
              if (wasLiked) { playbackSignalTracker.onUnliked(track); } else { playbackSignalTracker.onLiked(track); }
              if (mounted) setState(() {});
            }, active: isLiked),
            action(Icons.playlist_add_rounded, 'Playlist', () => showAddToPlaylistSheet(context, track)),
            action(Icons.lyrics_outlined, 'Lyrics', _openPlayerLyrics),
            action(Icons.share_rounded, 'Share', () => SharePlus.instance.share(ShareParams(text: 'Listen to "$title" by $artist on V Shots: https://www.youtube.com/watch?v=$trackId'))),
          ]),
        ),
        if (mgr.queue.length > 1) ...[
          const SizedBox(height: 10),
          Row(children: [
            const Text('UP NEXT', style: TextStyle(color: Colors.white, fontSize: 11, fontWeight: FontWeight.w900, letterSpacing: 1.1)),
            const SizedBox(width: 8),
            Text('${mgr.queue.length - 1} tracks', style: const TextStyle(color: Colors.white38, fontSize: 10)),
          ]),
          const SizedBox(height: 4),
          SizedBox(height: 76, child: ListView.separated(
            scrollDirection: Axis.horizontal,
            itemCount: mgr.queue.length,
            separatorBuilder: (_, __) => const SizedBox(width: 8),
            itemBuilder: (context, i) {
              final t = mgr.queue[i];
              final current = i == mgr.currentIndex;
              return InkWell(onTap: () => mgr.jumpTo(i), borderRadius: BorderRadius.circular(12), child: Container(width: 210,
                padding: const EdgeInsets.all(7), decoration: BoxDecoration(color: current ? AppColors.primary.withValues(alpha: 0.18) : Colors.white.withValues(alpha: 0.045), borderRadius: BorderRadius.circular(12), border: Border.all(color: current ? AppColors.accent.withValues(alpha: 0.35) : Colors.white.withValues(alpha: 0.06))),
                child: Row(children: [ClipRRect(borderRadius: BorderRadius.circular(8), child: AppImage(t['artwork'] as String?, width: 58, height: 58, fit: BoxFit.cover)), const SizedBox(width: 9), Expanded(child: Column(mainAxisAlignment: MainAxisAlignment.center, crossAxisAlignment: CrossAxisAlignment.start, children: [Text(t['title'] as String? ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: TextStyle(color: current ? AppColors.accent : Colors.white, fontWeight: FontWeight.w800, fontSize: 11.5)), const SizedBox(height: 3), Text(t['artist'] as String? ?? '', maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(color: Colors.white38, fontSize: 10))]))
              ));
            },
          )),
        ],
      ]),
    );
  }

  Widget _buildError() {'''
          s2, count = controls_pattern.subn(controls, s, count=1)
          if count != 1:
              raise SystemExit('expanded controls marker not found')
          s = s2

          # Add premium loading/sound overlay around the native browser.
          old_body = '''              _session.buildWidget(),\n              if (widget.controller.isLoading)\n                IgnorePointer(\n                  child: Container(\n                    color: Colors.black.withValues(alpha: 0.4),\n                    child: const Center(\n                      child: CircularProgressIndicator(color: AppColors.accent),\n                    ),\n                  ),\n                ),'''
          new_body = '''              ClipRRect(\n                borderRadius: const BorderRadius.vertical(top: Radius.circular(24)),\n                child: _session.buildWidget(),\n              ),\n              if (widget.controller.isLoading)\n                IgnorePointer(\n                  child: Container(\n                    decoration: const BoxDecoration(gradient: LinearGradient(begin: Alignment.topCenter, end: Alignment.bottomCenter, colors: [Color(0xAA05070D), Color(0xF505070D)])),\n                    child: Center(\n                      child: Column(mainAxisSize: MainAxisSize.min, children: [\n                        ClipRRect(borderRadius: BorderRadius.circular(16), child: AppImage(widget.controller.artwork, width: 86, height: 86, fit: BoxFit.cover, errorIconColor: AppColors.accent)),\n                        const SizedBox(height: 14),\n                        const Text('Preparing your track', style: TextStyle(color: Colors.white, fontSize: 14, fontWeight: FontWeight.w800)),\n                        const SizedBox(height: 10),\n                        SizedBox(width: 90, child: LinearProgressIndicator(minHeight: 3, borderRadius: BorderRadius.circular(3), color: AppColors.accent, backgroundColor: Colors.white12)),\n                      ]),\n                    ),\n                  ),\n                ),\n              if (widget.controller.audioMutedContent)\n                Positioned(\n                  left: 20, right: 20, bottom: 18,\n                  child: SafeArea(\n                    top: false,\n                    child: Center(\n                      child: FilledButton.icon(\n                        onPressed: () async {\n                          await _session.unmuteAndPlay();\n                          if (mounted) setState(() {});\n                        },\n                        style: FilledButton.styleFrom(backgroundColor: AppColors.accent, foregroundColor: Colors.black, padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 12), shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(18))),\n                        icon: const Icon(Icons.volume_up_rounded, size: 19),\n                        label: const Text('Tap to turn sound on', style: TextStyle(fontWeight: FontWeight.w900)),\n                      ),\n                    ),\n                  ),\n                ),'''
          if old_body not in s:
              raise SystemExit('browser body marker not found')
          s = s.replace(old_body, new_body, 1)
          write(p, s)

          # ---------------------------------------------------------------
          # Native WebView: no synthetic pause-causing unmute gesture. The
          # user-facing Flutter Sound button performs one explicit native
          # unmute+play action. Also improve WebView reuse/cache settings.
          # ---------------------------------------------------------------
          p = 'android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt'
          s = read(p)

          # Report audio state transitions to Flutter.
          old = '''    private fun setAudioState(next: BrowserAudioState) {\n        if (audioState == next) return\n        Log.d(TAG, "audio state: $audioState -> $next")\n        audioState = next\n    }'''
          new = '''    private fun setAudioState(next: BrowserAudioState) {\n        if (audioState == next) return\n        Log.d(TAG, "audio state: $audioState -> $next")\n        audioState = next\n        events.invokeMethod("audioState", mapOf(\n            "state" to next.name.lowercase(Locale.US),\n            "generation" to loadGeneration,\n        ))\n    }'''
