          # Remove the temporary CI environment file from the eventual commit.
          Path('.env').touch()

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/keystores/release.keystore -storepass "$PASS" -alias ci-build -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
            export ANDROID_KEYSTORE_PASSWORD="$PASS"
            export ANDROID_KEY_ALIAS=ci-build
            export ANDROID_KEY_PASSWORD="$PASS"
          fi
          flutter build apk --release
          flutter build appbundle --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated player fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .env .github/workflows/_premium_player_fix.yml
          git config user.name "V Shots Agent"
          git config user.email "agent@arena.ai"
          git add lib/features/foryou/discovery_browser_controller.dart \
                  lib/features/foryou/vshots_browser_session.dart \
                  lib/features/foryou/discovery_browser_sheet.dart \
                  android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt \
                  .github/workflows/_premium_player_fix.yml
          git commit -m "feat(player): premium UI and stabilize WebView playback" || exit 0
          git push origin HEAD:feat/production-upgrade
