name: One-time Dart format fix

on:
  push:
    branches: [feat/production-upgrade]

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/production-upgrade

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Pub get, format target, verify only target changed, commit and push
        run: |
          set -e
          flutter pub get
          dart format lib/features/foryou/for_you_feed_screen.dart

          CHANGED=$(git status --short | awk '{print $2}')
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "lib/features/foryou/for_you_feed_screen.dart" ]; then
            echo 'Unexpected files changed:'
            git status --short
            exit 1
          fi

          if git diff --quiet -- lib/features/foryou/for_you_feed_screen.dart; then
            echo 'Target file produced no formatting diff; nothing to commit.'
            exit 1
          fi

          dart format --output=none --set-exit-if-changed lib test

          CHANGED=$(git status --short | awk '{print $2}')
          if [ -n "$CHANGED" ] && [ "$CHANGED" != "lib/features/foryou/for_you_feed_screen.dart" ]; then
            echo 'Unexpected files changed after full format verification:'
            git status --short
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_one_time_format_fix.yml
          git add lib/features/foryou/for_you_feed_screen.dart .github/workflows/_one_time_format_fix.yml
          git commit -m 'style: format For You feed file'
          git push origin HEAD:feat/production-upgrade
