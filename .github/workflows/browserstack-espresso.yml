# V Shots — BrowserStack App Automate Espresso cold-launch smoke test.
#
# Runs the RELEASE app on a real device and asserts it survives cold launch.
# A startup crash (native or fatal Dart) fails the Espresso build and surfaces
# the crash stack trace. This is the automated on-device gate that `flutter
# test` / `flutter analyze` and the plain APK build cannot provide.
#
# Requires GitHub secrets: BROWSERSTACK_USERNAME, BROWSERSTACK_ACCESS_KEY.

name: V Shots BrowserStack Espresso Startup Smoke

on:
  workflow_dispatch:
  push:
    branches: [ fix/startup-first-frame, main, vshots-stable-baseline-401, feature/mrec-ads-phase2 ]

jobs:
  espresso-smoke:
    name: BrowserStack Espresso cold-launch smoke (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          LEVELPLAY_APP_KEY=${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01=${{ secrets.LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01 }}
          LEVELPLAY_UNIT_REWARDED_FEATURE_01=${{ secrets.LEVELPLAY_UNIT_REWARDED_FEATURE_01 }}
          LEVELPLAY_UNIT_BANNER_HOME_01=${{ secrets.LEVELPLAY_UNIT_BANNER_HOME_01 }}
          LEVELPLAY_DEBUG_USE_PRODUCTION=true
          EOF

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Apply Feature Patches (5b-5j)
        run: |
          python3 scripts/apply_dynamic_home_patch.py
          python3 scripts/run_stability_patch_robust.py
          python3 scripts/apply_content_policy_patch.py
          python3 scripts/apply_smart_listening_v2.py
          python3 scripts/apply_smart_queue_autoadvance.py
          python3 scripts/apply_runtime_refresh_notification_fix.py
          python3 scripts/apply_player_notification_actions.py
          python3 scripts/apply_ads_notification_reliability_fix.py
          python3 scripts/ensure_flutter_v2_android.py
          rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: 7. Build Debug APK + androidTest APK
        run: |
          flutter build apk --debug
          cd android
          ./gradlew assembleDebugAndroidTest

      - name: 8. Upload + Run BrowserStack Espresso Smoke
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_DEVICE: Xiaomi Redmi Note 11
          APP_APK: build/app/outputs/flutter-apk/app-debug.apk
        run: |
          # android/build.gradle redirects buildDir -> ../build, so the androidTest
          # APK is under repo-root build/, not app/build/. Resolve it robustly.
          TEST_APK=$(find build app/build -path '*androidTest*/debug/*-androidTest.apk' 2>/dev/null | head -1)
          if [ -z "$TEST_APK" ]; then
            echo "::error::androidTest APK not found"
            find build app/build -name '*-androidTest.apk' 2>/dev/null
            exit 1
          fi
          echo "Found test APK: $TEST_APK"
          export TEST_APK
          bash scripts/run_browserstack_espresso.sh