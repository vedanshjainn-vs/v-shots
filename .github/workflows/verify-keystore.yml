# ═════════════════════════════════════════════════════════════════════════════
# V Shots — Safe Keystore Certificate Verification
# ═════════════════════════════════════════════════════════════════════════════
#
# PURPOSE: Verify that the ANDROID_KEYSTORE_BASE64 secret contains the
#          correct upload keystore whose certificate SHA-1 matches the
#          Play Console upload key.
#
# SAFETY:  This workflow ONLY reads certificate metadata (SHA-1 fingerprint).
#          It NEVER prints, logs, or exposes:
#          - The base64 keystore contents
#          - The keystore file contents
#          - Private keys
#          - Passwords
#
# TRIGGER: Manual (workflow_dispatch) only
#
# OUTPUT:  A clear PASS/FAIL result with the SHA-1 comparison.
#          On FAIL, it reports the actual SHA-1 found (safe to share).
#
# ═════════════════════════════════════════════════════════════════════════════

name: Verify Keystore Certificate

on:
  workflow_dispatch:
    inputs:
      expected_sha1:
        description: 'Expected SHA-1 fingerprint (Play Console upload key)'
        required: false
        default: '5C:2F:85:4E:F4:2C:A5:AA:44:D9:7A:F6:51:AD:3A:8A:7B:83:07:F5'
      key_alias:
        description: 'Key alias in the keystore'
        required: false
        default: 'vshots'

permissions:
  contents: read

jobs:
  verify:
    name: Verify Keystore Certificate SHA-1
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Decode Keystore & Extract Certificate SHA-1
        id: extract
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ inputs.key_alias || 'vshots' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e

          # ── SAFETY CHECK: Ensure secret exists ──
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is NOT configured!"
            echo "result=SECRET_MISSING" >> $GITHUB_OUTPUT
            exit 1
          fi

          # ── SAFETY CHECK: Ensure password exists ──
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD secret is NOT configured!"
            echo "result=PASSWORD_MISSING" >> $GITHUB_OUTPUT
            exit 1
          fi

          # ── Decode keystore to TEMPORARY file (will be deleted) ──
          TEMP_KEYSTORE=$(mktemp /tmp/keystore-XXXXXX.keystore)
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$TEMP_KEYSTORE"
          chmod 600 "$TEMP_KEYSTORE"

          # ── SAFETY: Verify file was created and has content ──
          if [ ! -s "$TEMP_KEYSTORE" ]; then
            echo "::error::Failed to decode keystore from base64!"
            echo "result=DECODE_FAILED" >> $GITHUB_OUTPUT
            rm -f "$TEMP_KEYSTORE"
            exit 1
          fi

          # ── Extract certificate SHA-1 using keytool ──
          # The -v flag shows verbose output including SHA-1
          # We grep for SHA1: line and extract the fingerprint
          # IMPORTANT: We use storepass via environment variable, not command line
          #            to avoid it appearing in process list

          echo "Extracting certificate metadata..."
          CERT_OUTPUT=$(keytool -list -v \
            -keystore "$TEMP_KEYSTORE" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias "$KEY_ALIAS" 2>&1)

          # ── SAFETY: Immediately delete the keystore file ──
          rm -f "$TEMP_KEYSTORE"

          # ── Check if keytool succeeded ──
          if [ $? -ne 0 ]; then
            echo "::error::keytool failed to read keystore!"
            echo "result=KEYTOOL_FAILED" >> $GITHUB_OUTPUT
            # Print only the error type, not the full output (may contain sensitive info)
            echo "Error: Keystore could not be read with provided alias and password"
            exit 1
          fi

          # ── Extract SHA-1 fingerprint ──
          # keytool -v outputs: "SHA1: XX:XX:XX:..."
          SHA1=$(echo "$CERT_OUTPUT" | grep -i "SHA1:" | head -1 | awk '{print $2}' | tr -d '[:space:]')

          if [ -z "$SHA1" ]; then
            echo "::error::Could not extract SHA-1 from certificate!"
            echo "result=EXTRACT_FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi

          # ── Output ONLY the SHA-1 (safe to log) ──
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "  KEYSTORE CERTIFICATE SHA-1 (SAFE TO LOG)"
          echo "═══════════════════════════════════════════════════════"
          echo "  Found:    $SHA1"
          echo "═══════════════════════════════════════════════════════"
          echo ""

          # Store in output for next step
          echo "sha1=$SHA1" >> $GITHUB_OUTPUT

      - name: 4. Compare Against Expected SHA-1
        id: compare
        env:
          FOUND_SHA1: ${{ steps.extract.outputs.sha1 }}
          EXPECTED_SHA1: ${{ inputs.expected_sha1 || '5C:2F:85:4E:F4:2C:A5:AA:44:D9:7A:F6:51:AD:3A:8A:7B:83:07:F5' }}
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════"
          echo "  SHA-1 COMPARISON"
          echo "═══════════════════════════════════════════════════════"
          echo "  Expected (Play Console): $EXPECTED_SHA1"
          echo "  Found (CI Keystore):     $FOUND_SHA1"
          echo "═══════════════════════════════════════════════════════"
          echo ""

          # Normalize both to uppercase for comparison
          FOUND_UPPER=$(echo "$FOUND_SHA1" | tr '[:lower:]' '[:upper:]')
          EXPECTED_UPPER=$(echo "$EXPECTED_SHA1" | tr '[:lower:]' '[:upper:]')

          if [ "$FOUND_UPPER" = "$EXPECTED_UPPER" ]; then
            echo ""
            echo "  ✅ MATCH CONFIRMED"
            echo ""
            echo "  The ANDROID_KEYSTORE_BASE64 secret contains the CORRECT"
            echo "  upload keystore matching the Play Console upload key."
            echo ""
            echo "  STATUS: SAFE TO BUILD AND UPLOAD"
            echo ""
            echo "result=MATCH" >> $GITHUB_OUTPUT
          else
            echo ""
            echo "  ❌ MISMATCH DETECTED"
            echo ""
            echo "  The ANDROID_KEYSTORE_BASE64 secret does NOT match"
            echo "  the Play Console upload key certificate."
            echo ""
            echo "  DO NOT upload any AAB built with this keystore."
            echo "  DO NOT create a new keystore."
            echo "  DO NOT reset the upload key."
            echo ""
            echo "  Next steps:"
            echo "  1. Find the original keystore with SHA-1: $EXPECTED_SHA1"
            echo "  2. Update ANDROID_KEYSTORE_BASE64 with the correct keystore"
            echo "  3. Re-run this verification workflow"
            echo ""
            echo "result=MISMATCH" >> $GITHUB_OUTPUT
          fi

      - name: 5. Generate Verification Report
        if: always()
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════════════╗"
          echo "║       KEYSTORE VERIFICATION REPORT                   ║"
          echo "╠═══════════════════════════════════════════════════════╣"
          echo "║                                                      ║"
          echo "║  Run Date:        $(date -u +'%Y-%m-%d %H:%M UTC')          ║"
          echo "║  Repository:      ${{ github.repository }}            ║"
          echo "║  Workflow Run:    #${{ github.run_number }}                   ║"
          echo "║                                                      ║"
          echo "║  Expected SHA-1:  ${{ inputs.expected_sha1 || '5C:2F:85:4E:F4:2C:A5:AA:44:D9:7A:F6:51:AD:3A:8A:7B:83:07:F5' }}  ║"
          echo "║  Found SHA-1:     ${{ steps.extract.outputs.sha1 || 'N/A' }}  ║"
          echo "║  Result:          ${{ steps.compare.outputs.result || 'UNKNOWN' }}                         ║"
          echo "║                                                      ║"
          echo "╚═══════════════════════════════════════════════════════╝"
          echo ""

      - name: 6. Fail if Mismatch
        if: steps.compare.outputs.result == 'MISMATCH'
        run: |
          echo "::error::Keystore SHA-1 MISMATCH! DO NOT UPLOAD."
          exit 1
