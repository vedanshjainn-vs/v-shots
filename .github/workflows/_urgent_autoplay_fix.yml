name: V Shots Urgent Autoplay Fix

on:
  push:
    branches: [feat/production-upgrade]

permissions:
  contents: write

concurrency:
  group: urgent-autoplay-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'fix(playback): restore automatic song start'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Configure environment (.env)
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          LEVELPLAY_APP_KEY=${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01=${{ secrets.LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01 }}
          LEVELPLAY_UNIT_REWARDED_FEATURE_01=${{ secrets.LEVELPLAY_UNIT_REWARDED_FEATURE_01 }}
          LEVELPLAY_UNIT_BANNER_HOME_01=${{ secrets.LEVELPLAY_UNIT_BANNER_HOME_01 }}
          LEVELPLAY_DEBUG_USE_PRODUCTION=true
          EOF
      - name: Apply precise autoplay readiness fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          session = Path('lib/features/foryou/vshots_browser_session.dart')
          s = session.read_text()
          old = """        // Exactly one controlled SYSTEM_AUTOPLAY request. Page load and\n        // lifecycle callbacks never call play by themselves.\n        if (_autoplayPending && !_userPaused) {\n          _autoplayPending = false;\n          unawaited(play(userInitiated: false));\n        }\n"""
          new = """        // PageFinished can fire before YouTube has created the real media\n        // element. Delegate one bounded readiness-aware SYSTEM_AUTOPLAY\n        // request to native; it stops immediately after PLAYING is observed\n        // and is cancelled by an explicit user pause.\n        if (_autoplayPending && !_userPaused) {\n          _autoplayPending = false;\n          unawaited(_requestNativeAutoplay());\n        }\n"""
          if old not in s:
              raise SystemExit('Dart pageFinished autoplay block not found')
          s = s.replace(old, new, 1)
          anchor = """  /// Explicit PLAY. It is never implemented as a toggle.\n  Future<void> play({bool userInitiated = true}) async {\n"""
          insert = """  Future<void> _requestNativeAutoplay() async {\n    final channel = _channel;\n    if (channel == null || _disposed || _userPaused) return;\n    try {\n      await channel.invokeMethod<void>('autoplay');\n    } catch (_) {}\n  }\n\n  /// Explicit PLAY. It is never implemented as a toggle.\n  Future<void> play({bool userInitiated = true}) async {\n"""
          if anchor not in s:
              raise SystemExit('Dart play anchor not found')
          s = s.replace(anchor, insert, 1)
          session.write_text(s)

          native = Path('android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt')
          n = native.read_text()
          field_anchor = """    /** Explicit user pause guard. Polling must never fight the user. */\n    private var userPaused = false\n\n    /** Master switch for the ad assist (mute + official-skip click).\n"""
          field_new = """    /** Explicit user pause guard. Polling must never fight the user. */\n    private var userPaused = false\n\n    /** Token for the bounded, readiness-aware system autoplay request. */\n    private var autoplayRequestToken = 0L\n\n    /** Master switch for the ad assist (mute + official-skip click).\n"""
          if field_anchor not in n:
              raise SystemExit('Native userPaused anchor not found')
          n = n.replace(field_anchor, field_new, 1)

          load_anchor = """        nearEndReported = false\n        adActive = false\n        userPaused = !autoplay\n        mediaPlaying = false\n"""
          load_new = """        nearEndReported = false\n        adActive = false\n        autoplayRequestToken++\n        userPaused = !autoplay\n        mediaPlaying = false\n"""
          if load_anchor not in n:
              raise SystemExit('Native load reset anchor not found')
          n = n.replace(load_anchor, load_new, 1)

          page_anchor = """            override fun onPageFinished(view: WebView?, url: String?) {\n                if (!isCurrentPage(url)) return\n                events.invokeMethod(\"pageFinished\", mapOf(\"generation\" to loadGeneration))\n                startPlaybackPolling()\n            }\n"""
          page_new = """            override fun onPageFinished(view: WebView?, url: String?) {\n                if (!isCurrentPage(url)) return\n                events.invokeMethod(\"pageFinished\", mapOf(\"generation\" to loadGeneration))\n                startPlaybackPolling()\n            }\n"""
          if page_anchor not in n:
              raise SystemExit('Native pageFinished block not found')

          method_anchor = """    fun userPlay() {\n        userPaused = false\n        startPlaybackForegroundService(\n"""
          method_new = """    /**\n     * Start the CURRENT YouTube media only after its real HTML media element\n     * exists. PageFinished is not a readiness guarantee: YouTube can finish\n     * the document while the player iframe/video element is still being\n     * constructed. The old implementation consumed the one autoplay request\n     * too early, leaving the user to tap the video manually.\n     *\n     * This is intentionally bounded and state-safe: it probes for the media\n     * element for at most 4 seconds, calls play only while autoplay is still\n     * requested, stops on confirmed playing, and is invalidated by load/pause.\n     * It never runs from the playback polling loop and never overrides a user\n     * pause.\n     */\n    fun requestAutoplayWhenReady() {\n        val token = ++autoplayRequestToken\n        val generation = loadGeneration\n        var attempts = 0\n        val runnable = object : Runnable {\n            override fun run() {\n                if (generation != loadGeneration || token != autoplayRequestToken || userPaused) return\n                if (mediaPlaying) return\n                attempts++\n                evaluateJavascript(\n                    \"\"\"(function(){\n                      try {\n                        var v=document.querySelector('video,audio');\n                        if(!v) return 'not-ready';\n                        v.muted=false; v.volume=1;\n                        var p=v.play();\n                        if(p && p.catch){ p.catch(function(){}); }\n                        return 'play-requested';\n                      } catch(e) { return 'error'; }\n                    })()\"\"\".trimIndent(),\n                ) { result ->\n                    if (generation != loadGeneration || token != autoplayRequestToken || userPaused) return@evaluateJavascript\n                    val state = cleanJsResult(result)\n                    if (state == \"play-requested\") return@evaluateJavascript\n                }\n                if (attempts < 16 && generation == loadGeneration && token == autoplayRequestToken && !userPaused) {\n                    handler.postDelayed(this, 250L)\n                }\n            }\n        }\n        handler.post(runnable)\n    }\n\n    fun userPlay() {\n        autoplayRequestToken++\n        userPaused = false\n        startPlaybackForegroundService(\n"""
          if method_anchor not in n:
              raise SystemExit('Native userPlay anchor not found')
          n = n.replace(method_anchor, method_new, 1)

          pause_anchor = """    fun pauseMedia(userInitiated: Boolean = true) {\n        if (userInitiated) userPaused = true\n"""
          pause_new = """    fun pauseMedia(userInitiated: Boolean = true) {\n        if (userInitiated) {\n            userPaused = true\n            autoplayRequestToken++\n        }\n"""
          if pause_anchor not in n:
              raise SystemExit('Native pause anchor not found')
          n = n.replace(pause_anchor, pause_new, 1)

          n = n.replace("""                \"play\" -> {\n                    webView.userPlay()\n                    result.success(null)\n                }\n""", """                \"play\" -> {\n                    webView.userPlay()\n                    result.success(null)\n                }\n                \"autoplay\" -> {\n                    webView.requestAutoplayWhenReady()\n                    result.success(null)\n                }\n""", 1)
          native.write_text(n)

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          g2 = g.replace('versionCode 48', 'versionCode 49', 1).replace('versionName \"5.9.4\"', 'versionName \"5.9.5\"', 1)
          if g2 == g:
              raise SystemExit('Android version bump did not apply')
          gradle.write_text(g2)

          pubspec = Path('pubspec.yaml')
          p = pubspec.read_text()
          p2 = p.replace('version: 5.9.1+44', 'version: 5.9.5+49', 1)
          if p2 == p:
              raise SystemExit('pubspec version bump did not apply')
          pubspec.write_text(p2)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK + AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/keystores/release.keystore -storepass "$PASS" -alias ci-build -keypass "$PASS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
            export ANDROID_KEYSTORE_PASSWORD="$PASS"
            export ANDROID_KEY_ALIAS=ci-build
            export ANDROID_KEY_PASSWORD="$PASS"
          fi
          flutter build apk --release
          flutter build appbundle --release
      - name: Validate artifacts
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab
          sha256sum build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: vshots-5.9.5-urgent-autoplay-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: vshots-5.9.5-urgent-autoplay-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Commit validated source and remove runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/_urgent_autoplay_fix.yml
          git add lib/features/foryou/vshots_browser_session.dart android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt android/app/build.gradle pubspec.yaml .github/workflows/_urgent_autoplay_fix.yml
          git diff --cached --quiet && { echo "No source changes to commit"; exit 1; } || true
          git commit -m "fix(playback): restore automatic song start"
          git push origin HEAD:feat/production-upgrade
