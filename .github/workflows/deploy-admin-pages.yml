name: Deploy V Shots Admin to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['admin/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './admin'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
