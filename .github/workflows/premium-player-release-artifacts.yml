name: V Shots Premium Player Release Artifacts

on:
  push:
    branches: [feat/production-upgrade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: premium-player-release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Premium player validation and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current production-upgrade source
        uses: actions/checkout@v4
        with:
          ref: feat/production-upgrade
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configure environment exactly as production CI
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          LEVELPLAY_APP_KEY=${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01=${{ secrets.LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01 }}
          LEVELPLAY_UNIT_REWARDED_FEATURE_01=${{ secrets.LEVELPLAY_UNIT_REWARDED_FEATURE_01 }}
          LEVELPLAY_UNIT_BANNER_HOME_01=${{ secrets.LEVELPLAY_UNIT_BANNER_HOME_01 }}
          LEVELPLAY_DEBUG_USE_PRODUCTION=true
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter analyze
        run: flutter analyze --fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret required}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret required}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret required}"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore android/app/keystores/release.keystore \
              -storepass "$PASS" \
              -alias ci-build \
              -keypass "$PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH=keystores/release.keystore
            export ANDROID_KEYSTORE_PASSWORD="$PASS"
            export ANDROID_KEY_ALIAS=ci-build
            export ANDROID_KEY_PASSWORD="$PASS"
          fi
          flutter build apk --release
          flutter build appbundle --release

      - name: Validate files, sizes, and SHA-256
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -f "$APK"
          test -f "$AAB"
          APK_BYTES=$(stat -c '%s' "$APK")
          AAB_BYTES=$(stat -c '%s' "$AAB")
          APK_SHA256=$(sha256sum "$APK" | awk '{print $1}')
          AAB_SHA256=$(sha256sum "$AAB" | awk '{print $1}')
          test "$APK_BYTES" -gt 0
          test "$AAB_BYTES" -gt 0
          echo "APK_BYTES=$APK_BYTES"
          echo "APK_SHA256=$APK_SHA256"
          echo "AAB_BYTES=$AAB_BYTES"
          echo "AAB_SHA256=$AAB_SHA256"
          {
            echo "## Premium player release artifacts"
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "|---|---:|---|"
            echo "| APK | $APK_BYTES | $APK_SHA256 |"
            echo "| AAB | $AAB_BYTES | $AAB_SHA256 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload premium player APK
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload premium player AAB
        uses: actions/upload-artifact@v4
        with:
          name: vshots-premium-player-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
