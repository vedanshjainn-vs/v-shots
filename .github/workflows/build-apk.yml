name: V Shots APK Build & Test

on:
  push:
    branches: [ main, feat/dynamic-home-recommendations ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          LEVELPLAY_APP_KEY=${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01=${{ secrets.LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01 }}
          LEVELPLAY_UNIT_REWARDED_FEATURE_01=${{ secrets.LEVELPLAY_UNIT_REWARDED_FEATURE_01 }}
          LEVELPLAY_UNIT_BANNER_HOME_01=${{ secrets.LEVELPLAY_UNIT_BANNER_HOME_01 }}
          LEVELPLAY_UNIT_MREC_300X250_01=${{ secrets.LEVELPLAY_UNIT_MREC_300X250_01 }}
          LEVELPLAY_DEBUG_USE_PRODUCTION=true
          EOF
      - name: 4b. Inject Production AdMob App ID + enforce Flutter v2
        run: |
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i "s|c\\/a-pub-3940256099942544~3347511713|${{ secrets.ADMOB_APP_ID }}|g" android/app/src/main/AndroidManifest.xml
          fi
          python3 scripts/ensure_flutter_v2_android.py
      - name: 5. Install Dependencies
        run: flutter pub get
      - name: 5b. Apply Dynamic Home Recommendation Patch
        run: |
          python3 scripts/apply_dynamic_home_patch.py
          dart format lib/features/home/home_feed_service.dart lib/features/home/home_screen.dart lib/features/home/dynamic_home_sections.dart lib/core/notifications/notification_service.dart lib/core/notifications/smart_notification_service.dart
      - name: 5c. Apply Stability Audit Patch
        run: |
          python3 scripts/run_stability_patch_robust.py
          dart format lib/features/home/home_feed_service.dart lib/features/foryou/for_you_feed_screen.dart lib/core/discover/discover_feed_engine.dart lib/core/notifications/notification_service.dart lib/main.dart
      - name: 5d. Apply Regional + Content Policy Patch
        run: |
          python3 scripts/apply_content_policy_patch.py
          dart format lib/core/music/music_validator.dart lib/core/discover/discover_feed_engine.dart lib/core/recommendation/music_recommendation_engine.dart lib/core/recommendation/music_region_profile.dart lib/features/foryou/for_you_feed_service.dart
      - name: 5e. Apply Smart Listening V2 Patch
        run: |
          python3 scripts/apply_smart_listening_v2.py
          python3 scripts/apply_smart_queue_autoadvance.py
          dart format lib/core/playback/vshots_playback_manager.dart lib/core/recommendation/music_recommendation_config.dart lib/core/recommendation/smart_listening_service.dart lib/features/home/smart_listening_section.dart lib/main.dart lib/features/home/home_screen.dart
          dart fix --apply
          dart format lib/core/playback/vshots_playback_manager.dart lib/core/recommendation/music_recommendation_config.dart lib/core/recommendation/smart_listening_service.dart lib/features/home/smart_listening_section.dart lib/main.dart lib/features/home/home_screen.dart
      - name: 5f. Apply Runtime Refresh + Notification Fix
        run: |
          python3 scripts/apply_runtime_refresh_notification_fix.py
          dart format lib/core/recommendation/music_region_profile.dart lib/core/recommendation/signal_store.dart lib/core/recommendation/smart_listening_service.dart lib/core/discover/discover_feed_engine.dart lib/features/home/home_screen.dart lib/features/home/smart_listening_section.dart lib/main.dart
          dart fix --apply
          dart format lib/core/recommendation/music_region_profile.dart lib/core/recommendation/signal_store.dart lib/core/recommendation/smart_listening_service.dart lib/core/discover/discover_feed_engine.dart lib/features/home/home_screen.dart lib/features/home/smart_listening_section.dart lib/main.dart
      - name: 5g. Apply + Validate Browser Player Notification Bridge
        run: |
          set -e
          python3 scripts/apply_player_notification_actions.py
          grep -q 'VShotsBrowserPlaybackService.eventChannel = events' android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt
          grep -q 'ACTION_UPDATE' android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt
          grep -q 'notificationAction' lib/features/foryou/vshots_browser_session.dart
          grep -q 'updateNotification' lib/features/foryou/vshots_browser_session.dart
          grep -q 'onNotificationAction' lib/features/foryou/discovery_browser_sheet.dart
          dart format lib/features/foryou/vshots_browser_session.dart lib/features/foryou/discovery_browser_sheet.dart
      - name: 5h. Validate MREC + Notification Sources
        run: |
          set -e
          dart format lib/core/ads/mrec_ad_manager.dart lib/core/ads/premium_mrec_ad_card.dart lib/core/ads/native_ad_widget.dart lib/core/notifications/notification_service.dart
          test -f lib/core/ads/mrec_ad_manager.dart
          test -f lib/core/ads/premium_mrec_ad_card.dart
          grep -q 'MEDIUM_RECTANGLE' lib/core/ads/premium_mrec_ad_card.dart
          grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
      - name: 5i. Apply Ads + Notification Reliability Fix
        run: |
          python3 scripts/apply_ads_notification_reliability_fix.py
          dart format lib/core/ads/levelplay_service.dart lib/core/ads/levelplay_config.dart lib/core/ads/mrec_ad_manager.dart lib/core/ads/premium_mrec_ad_card.dart lib/core/notifications/notification_service.dart
      - name: 5j. Apply Premium Unity MREC Ads Patch
        run: |
          set -e
          python3 scripts/apply_mrec_ads_patch.py
          dart format lib/features/foryou/for_you_feed_screen.dart lib/main.dart lib/core/ads/mrec_ad_manager.dart lib/core/ads/premium_mrec_ad_card.dart lib/core/ads/native_ad_widget.dart
          grep -q 'MRECPlacement.discoverFeed' lib/features/foryou/for_you_feed_screen.dart
          grep -q 'MRECPlacement.search' lib/main.dart
          grep -q 'LevelPlayAdSize.MEDIUM_RECTANGLE' lib/core/ads/premium_mrec_ad_card.dart
      - name: 5k. Apply Startup Recovery Patch LAST
        run: |
          python3 scripts/apply_startup_recovery_patch.py
          dart format lib/main.dart
          grep -q 'runApp(const VShotsApp());' lib/main.dart
          grep -q 'Future<void> _bootstrapAfterFirstFrame' lib/main.dart
          grep -q 'Future<void> _bootstrapAudio' lib/main.dart
          grep -q 'late-audio-bind' lib/main.dart
      - name: 5l. Final Flutter v2 manifest validation
        run: python3 scripts/ensure_flutter_v2_android.py
      - name: 6. Run Formatting Check
        run: |
          set -e
          git ls-files -z -- '*.dart' | xargs -0 -r dart format --output=none --set-exit-if-changed
      - name: 7. Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos
      - name: 8. Run Unit & Widget Tests
        run: flutter test
      - name: 8b. Diagnose Android embedding before release build
        run: |
          set -e
          python3 scripts/ensure_flutter_v2_android.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          p='android/app/src/main/AndroidManifest.xml'
          ns='{http://schemas.android.com/apk/res/android}'
          r=ET.parse(p).getroot()
          a=r.find('application')
          print('application android:name =', a.get(ns+'name'))
          print('flutterEmbedding markers =', [(x.get(ns+'name'), x.get(ns+'value')) for x in r.iter('meta-data') if x.get(ns+'name')=='flutterEmbedding'])
          assert a.get(ns+'name') != 'io.flutter.app.FlutterApplication'
          assert any(x.get(ns+'name')=='flutterEmbedding' and x.get(ns+'value')=='2' for x in r.iter('meta-data'))
          PY
          find android -type f \( -name '*.kt' -o -name '*.java' \) -print0 | xargs -0 -r grep -nE 'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(' || true
          find android -type f -name 'GeneratedPluginRegistrant.java' -delete
      - name: 9. Setup Keystore & Build Release APK/AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret required}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret required}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret required}"
          else
            CI_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/keystores/release.keystore -storepass "$CI_PASS" -alias ci-build -keypass "$CI_PASS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$CI_PASS"
            export ANDROID_KEY_ALIAS="ci-build"
            export ANDROID_KEY_PASSWORD="$CI_PASS"
          fi
          flutter clean
          flutter pub get
          python3 scripts/ensure_flutter_v2_android.py
          find android -type f -name 'GeneratedPluginRegistrant.java' -delete
          flutter build apk --release
          flutter build appbundle --release
      - name: 9a. Capture Android Build Diagnostics
        if: always()
        run: |
          set +e
          {
            echo '=== Flutter ==='
            flutter --version
            echo '=== Android legacy embedding markers in project ==='
            find android -type f \( -name '*.kt' -o -name '*.java' \) -print0 | xargs -0 -r grep -nE 'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(' || true
            echo '=== GeneratedPluginRegistrant files ==='
            find android -type f -name 'GeneratedPluginRegistrant.java' -print || true
            echo '=== Pub cache legacy embedding markers ==='
            find "$HOME/.pub-cache/hosted/pub.dev" -type f \( -name '*.kt' -o -name '*.java' \) -print0 2>/dev/null | xargs -0 -r grep -lE 'io\.flutter\.app\.|PluginRegistry\.Registrar|registerWith\(' 2>/dev/null | head -80 || true
            echo '=== Pub dependencies ==='
            flutter pub deps --style=compact | head -250
          } > build-diagnostics.txt 2>&1
          cat build-diagnostics.txt
      - name: 9b. Upload Android Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-build-diagnostics-${{ github.run_number }}
          path: build-diagnostics.txt
          retention-days: 14
      - name: 10. Build Debug APK
        run: |
          find android -type f -name 'GeneratedPluginRegistrant.java' -delete
          flutter build apk --debug
      - name: 11. Validate Generated APKs & AAB
        run: |
          set -e
          [ -f build/app/outputs/flutter-apk/app-debug.apk ]
          [ -f build/app/outputs/flutter-apk/app-release.apk ]
          [ -f build/app/outputs/bundle/release/app-release.aab ]
      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      - name: 14. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: 15. Upload APK to BrowserStack App Automate
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "BrowserStack credentials not configured; skipping upload."
            exit 0
          fi
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@build/app/outputs/flutter-apk/app-release.apk" -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "$RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '\"app_url\":\"[^\"]*\"' | cut -d'\"' -f4)
          [ -z "$APP_URL" ] || echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
      - name: 16. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        continue-on-error: true
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"
