name: V Shots APK Build & Test

on:
  push:
    branches: [ main, youtube-official-player-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          EOF

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Run Formatting Check
        run: dart format .

      - name: 7. Run Flutter Analyzer
        run: flutter analyze

      - name: 8. Run Unit & Widget Tests
        run: flutter test

      - name: 9. Setup Keystore & Build Release APK
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
          else
            keytool -genkeypair -v \
              -keystore android/app/keystores/release.keystore \
              -storepass vshots2024 \
              -alias vshots \
              -keypass vshots2024 \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=V Shots, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
          fi
          export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
          export ANDROID_KEYSTORE_PASSWORD="vshots2024"
          export ANDROID_KEY_ALIAS="vshots"
          export ANDROID_KEY_PASSWORD="vshots2024"
          flutter build apk --release

      - name: 10. Build Debug APK
        run: flutter build apk --debug

      - name: 11. Validate Generated APKs
        run: |
          DEBUG_APK="build/app/outputs/flutter-apk/app-debug.apk"
          RELEASE_APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not found at expected path: $DEBUG_APK"
            exit 1
          fi
          if [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK was not found at expected path: $RELEASE_APK"
            exit 1
          fi
          DEBUG_SIZE=$(stat -c%s "$DEBUG_APK" 2>/dev/null || stat -f%z "$DEBUG_APK")
          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK")
          echo "✅ Debug APK Size: $DEBUG_SIZE bytes"
          echo "✅ Release APK Size: $RELEASE_SIZE bytes"

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 14. Publish GitHub Release with Direct APK Downloads
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ./v-shots-5.6.0-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk ./v-shots-5.6.0-debug.apk
          gh release create v5.6.0 \
            ./v-shots-5.6.0-release.apk \
            ./v-shots-5.6.0-debug.apk \
            --title "V Shots v5.6.0 (Build 18) Nova Edition" \
            --notes "V Shots v5.6.0 Nova Edition Production Build. 120+ verified tracks, YouTube IFrame only, premium Home/Discover/Search/Mini-Player, RLS secured. Download v-shots-5.6.0-release.apk below." \
            --clobber || true

      - name: 15. Upload APK to BrowserStack App Automate
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "BrowserStack upload response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$APP_URL" ]; then
            echo "::warning::BrowserStack upload did not return an app_url — check the response above."
            exit 0
          fi
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "✅ Uploaded to BrowserStack: $APP_URL"

      - name: 16. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"
