name: V Shots APK Build & Test

on:
  push:
    branches: [ main, youtube-official-player-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          EOF

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Run Formatting Check
        run: dart format --output=none --set-exit-if-changed .

      - name: 7. Run Flutter Analyzer
        run: flutter analyze

      - name: 8. Run Unit & Widget Tests
        run: flutter test

      - name: 9. Build Debug APK
        run: flutter build apk --debug

      - name: 10. Validate Generated APK
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK was not found at expected path: $APK_PATH"
            exit 1
          fi
          SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "✅ Debug APK built successfully! Size: $SIZE bytes"

      - name: 11. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: 12. Upload APK to BrowserStack App Automate
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@build/app/outputs/flutter-apk/app-debug.apk" \
            -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "BrowserStack upload response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$APP_URL" ]; then
            echo "::warning::BrowserStack upload did not return an app_url — check the response above."
            exit 0
          fi
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "✅ Uploaded to BrowserStack: $APP_URL"

      - name: 13. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"
