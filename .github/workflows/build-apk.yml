name: V Shots APK Build & Test

on:
  push:
    branches: [ main, youtube-official-player-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true
      - name: 3b. Home-only Premium ArchiveTune implementation + validation
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git fetch origin feature/home-premium-final-v1:refs/remotes/origin/feature/home-premium-final-v1
          rm -rf /tmp/vshots-home-feature
          git worktree add --detach /tmp/vshots-home-feature origin/feature/home-premium-final-v1
          cd /tmp/vshots-home-feature
          python3 - <<'PY'
          from pathlib import Path
          main = Path('lib/main.dart')
          text = main.read_text(encoding='utf-8')
          if "features/polish/premium_archive_home_screen.dart" not in text:
              marker = "import 'features/polish/archive_style_screens.dart';"
              text = text.replace(marker, marker + "\nimport 'features/polish/premium_archive_home_screen.dart';")
          old = "ArchiveStyleHomeScreen(\n                  onPlay: (context, track, queue, index) =>\n                      playTrack(context, track, queue, index),\n                ),"
          new = "PremiumArchiveHomeScreen(\n                  onPlay: (context, track, queue, index) =>\n                      playTrack(context, track, queue, index),\n                ),"
          if old in text:
              text = text.replace(old, new, 1)
          main.write_text(text, encoding='utf-8')
          print('Premium ArchiveTune Home wired into MainShell')
          PY
          touch .env
          flutter pub get
          dart format lib/main.dart lib/features/polish/premium_archive_home_screen.dart
          flutter analyze
          flutter test
          flutter build apk --debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/features/polish/premium_archive_home_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "[home-bot] feat(home): use premium ArchiveTune Home"
            git push origin HEAD:feature/home-premium-final-v1
          fi
          cd - >/dev/null
      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          ADMOB_NATIVE_AD_ID=${{ secrets.ADMOB_NATIVE_AD_ID }}
          EOF
      - name: 4b. Inject Production AdMob App ID (when configured)
        run: |
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i "s|c\\/a-pub-3940256099942544~3347511713|${{ secrets.ADMOB_APP_ID }}|g" android/app/src/main/AndroidManifest.xml
          fi
      - name: 5. Install Dependencies
        run: flutter pub get
      - name: 6. Run Formatting Check
        run: dart format .
      - name: 7. Run Flutter Analyzer
        run: flutter analyze
      - name: 8. Run Unit & Widget Tests
        run: flutter test
      - name: 9. Setup Keystore & Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret required}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret required}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret required}"
          else
            CI_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/keystores/release.keystore -storepass "$CI_PASS" -alias ci-build -keypass "$CI_PASS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$CI_PASS"
            export ANDROID_KEY_ALIAS="ci-build"
            export ANDROID_KEY_PASSWORD="$CI_PASS"
          fi
          flutter build apk --release
          flutter build appbundle --release
      - name: 10. Build Debug APK
        run: flutter build apk --debug
      - name: 11. Validate Generated APKs & AAB
        run: |
          set -e
          [ -f build/app/outputs/flutter-apk/app-debug.apk ]
          [ -f build/app/outputs/flutter-apk/app-release.apk ]
          [ -f build/app/outputs/bundle/release/app-release.aab ]
      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90
      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
      - name: 13b. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90
      - name: 15. Upload APK to BrowserStack App Automate
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@build/app/outputs/flutter-apk/app-release.apk" -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "$RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
          [ -z "$APP_URL" ] || echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
      - name: 16. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"