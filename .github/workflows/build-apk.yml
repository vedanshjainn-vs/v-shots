name: V Shots APK Build & Test

on:
  push:
    branches: [ main, youtube-official-player-migration ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          ADMOB_NATIVE_AD_ID=${{ secrets.ADMOB_NATIVE_AD_ID }}
          EOF

      - name: 4b. Inject Production AdMob App ID (when configured)
        run: |
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i "s|c\\/a-pub-3940256099942544~3347511713|${{ secrets.ADMOB_APP_ID }}|g" \
              android/app/src/main/AndroidManifest.xml
            echo "Injected production AdMob App ID."
          else
            echo "No ADMOB_APP_ID secret — keeping the TEST AdMob App ID."
          fi

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Run Formatting Check
        run: dart format .

      - name: 7. Run Flutter Analyzer
        run: flutter analyze

      - name: 8. Run Unit & Widget Tests
        run: flutter test

      - name: 9. Setup Keystore & Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            # Use the real release keystore from GitHub Secrets.
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret required}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret required}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret required}"
          else
            # No release keystore secret configured: generate a CI throwaway
            # keystore with a random, non-committed password so the build still
            # succeeds. The resulting APK/AAB is NOT the production signing key.
            CI_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v \
              -keystore android/app/keystores/release.keystore \
              -storepass "$CI_PASS" \
              -alias ci-build \
              -keypass "$CI_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 365 \
              -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$CI_PASS"
            export ANDROID_KEY_ALIAS="ci-build"
            export ANDROID_KEY_PASSWORD="$CI_PASS"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — built with a CI throwaway keystore, NOT the production key."
          fi
          flutter build apk --release
          # Build the Play Store AAB in the SAME step so it inherits the same
          # keystore + password (secrets when configured, otherwise the CI
          # throwaway keystore created above).
          flutter build appbundle --release

      - name: 10. Build Debug APK
        run: flutter build apk --debug

      - name: 11. Validate Generated APKs & AAB
        run: |
          set -e
          DEBUG_APK="build/app/outputs/flutter-apk/app-debug.apk"
          RELEASE_APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          [ -f "$DEBUG_APK" ] || { echo "::error::Debug APK missing"; exit 1; }
          [ -f "$RELEASE_APK" ] || { echo "::error::Release APK missing"; exit 1; }
          [ -f "$AAB" ] || { echo "::error::Release AAB missing"; exit 1; }
          echo "✅ Debug APK: $(stat -c%s "$DEBUG_APK") bytes"
          echo "✅ Release APK: $(stat -c%s "$RELEASE_APK") bytes"
          echo "✅ Release AAB: $(stat -c%s "$AAB") bytes"
          echo "RELEASE_SHA256=$(sha256sum "$RELEASE_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "DEBUG_SHA256=$(sha256sum "$DEBUG_APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "AAB_SHA256=$(sha256sum "$AAB" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: 13b. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: 14. Publish GitHub Release
        # Release creation is DISABLED until the production acceptance gate is
        # fully passed (device testing + required secrets configured). Remove
        # this `if` guard only once that gate is cleared.
        if: github.ref == 'refs/heads/main' && env.ENABLE_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENABLE_RELEASE: ${{ vars.ENABLE_RELEASE }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ./v-shots-5.7.0-release.apk
          cp build/app/outputs/flutter-apk/app-debug.apk ./v-shots-5.7.0-debug.apk
          cp build/app/outputs/bundle/release/app-release.aab ./v-shots-5.7.0-release.aab
          gh release create v5.7.0 \
            ./v-shots-5.7.0-release.apk \
            ./v-shots-5.7.0-debug.apk \
            ./v-shots-5.7.0-release.aab \
            --title "V Shots v5.7.0 (Build 19)" \
            --notes "Release publishing is gated — only publishes when ENABLE_RELEASE=true and the acceptance gate is passed." \
            --clobber || echo "::warning::Release step skipped (gate not enabled)."

      - name: 15. Upload APK to BrowserStack App Automate
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          set -e
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "BrowserStack upload response: $RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '"app_url":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$APP_URL" ]; then
            echo "::warning::BrowserStack upload did not return an app_url — check the response above."
            exit 0
          fi
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "✅ Uploaded to BrowserStack: $APP_URL"

      - name: 16. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"
