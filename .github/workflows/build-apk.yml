name: V Shots APK Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Validate V Shots APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter (Stable 3.44.9)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 4. Configure Environment (.env)
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          LEVELPLAY_APP_KEY=${{ secrets.LEVELPLAY_APP_KEY }}
          LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01=${{ secrets.LEVELPLAY_UNIT_INTERSTITIAL_SESSION_BREAK_01 }}
          LEVELPLAY_UNIT_REWARDED_FEATURE_01=${{ secrets.LEVELPLAY_UNIT_REWARDED_FEATURE_01 }}
          LEVELPLAY_UNIT_BANNER_HOME_01=${{ secrets.LEVELPLAY_UNIT_BANNER_HOME_01 }}
          LEVELPLAY_DEBUG_USE_PRODUCTION=true
          EOF

      - name: 4b. Inject Production AdMob App ID (when configured)
        run: |
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            sed -i "s|c\\/a-pub-3940256099942544~3347511713|${{ secrets.ADMOB_APP_ID }}|g" android/app/src/main/AndroidManifest.xml
          fi

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 5b. Apply Dynamic Home Recommendation Patch
        run: |
          python3 scripts/apply_dynamic_home_patch.py
          dart format lib/features/home/home_feed_service.dart lib/features/home/home_screen.dart lib/features/home/dynamic_home_sections.dart lib/core/notifications/notification_service.dart lib/core/notifications/smart_notification_service.dart

      - name: 6. Run Formatting Check
        run: |
          set -e
          git ls-files -z -- '*.dart' | xargs -0 -r dart format --output=none --set-exit-if-changed

      - name: 7. Run Flutter Analyzer
        run: flutter analyze --no-fatal-infos

      - name: 8. Run Unit & Widget Tests
        run: flutter test

      - name: 9. Setup Keystore & Build Release APK/AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/app/keystores
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystores/release.keystore
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret required}"
            export ANDROID_KEY_ALIAS="${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret required}"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret required}"
          else
            CI_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/app/keystores/release.keystore -storepass "$CI_PASS" -alias ci-build -keypass "$CI_PASS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=V Shots CI, OU=Mobile, O=V Shots Live, L=Indore, ST=Madhya Pradesh, C=IN"
            export ANDROID_KEYSTORE_PATH="keystores/release.keystore"
            export ANDROID_KEYSTORE_PASSWORD="$CI_PASS"
            export ANDROID_KEY_ALIAS="ci-build"
            export ANDROID_KEY_PASSWORD="$CI_PASS"
          fi
          flutter build apk --release
          flutter build appbundle --release

      - name: 10. Build Debug APK
        run: flutter build apk --debug

      - name: 11. Validate Generated APKs & AAB
        run: |
          set -e
          [ -f build/app/outputs/flutter-apk/app-debug.apk ]
          [ -f build/app/outputs/flutter-apk/app-release.apk ]
          [ -f build/app/outputs/bundle/release/app-release.aab ]

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 90

      - name: 13. Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: 14. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: 15. Upload APK to BrowserStack App Automate
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          RESPONSE=$(curl -sS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" -X POST "https://api-cloud.browserstack.com/app-automate/upload" -F "file=@build/app/outputs/flutter-apk/app-release.apk" -F "custom_id=v-shots-ci-${{ github.run_number }}")
          echo "$RESPONSE"
          APP_URL=$(echo "$RESPONSE" | grep -o '\"app_url\":\"[^\"]*\"' | cut -d'\"' -f4)
          [ -z "$APP_URL" ] || echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - name: 16. Run BrowserStack Real-Device Smoke Test
        if: ${{ env.APP_URL != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: bash scripts/browserstack_smoke_test.sh "$APP_URL"
