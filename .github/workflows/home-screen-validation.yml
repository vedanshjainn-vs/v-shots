name: Home Screen — ArchiveTune v2 Validation

on:
  push:
    branches: [feature/home-archivetune-v2]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  home:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Configure environment
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_ANDROID_CLIENT_ID=${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID || secrets.GOOGLE_ANDROID_CLIENT_ID }}
          YOUTUBE_DATA_API_KEY=${{ secrets.YOUTUBE_DATA_API_KEY }}
          ADMOB_NATIVE_AD_ID=${{ secrets.ADMOB_NATIVE_AD_ID }}
          EOF

      - name: Integrate Home only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          home = Path('lib/features/polish/premium_archive_home_screen.dart')
          s = home.read_text()
          old = "Map<String, dynamic>? get _hero => _layout.map(_tracks).expand((x) => x).firstOrNull;"
          new = """Map<String, dynamic>? get _hero {
            for (final shelf in _layout) {
              final tracks = _tracks(shelf);
              if (tracks.isNotEmpty) return tracks.first;
            }
            return null;
          }"""
          s = s.replace(old, new)
          old_play = "Widget _play(Map<String, dynamic> t) { final q = _tracks(_layout.first); final i = q.indexWhere((x) => _id(x) == _id(t)); unawaited(widget.onPlay(context, t, q.isEmpty ? [t] : q, i < 0 ? 0 : i)); return const SizedBox.shrink(); }"
          new_play = """Future<void> _play(Map<String, dynamic> t) async {
            final q = _tracks(_layout.first);
            final i = q.indexWhere((x) => _id(x) == _id(t));
            await widget.onPlay(context, t, q.isEmpty ? [t] : q, i < 0 ? 0 : i);
          }"""
          s = s.replace(old_play, new_play)
          s = s.replace('onTap: () => _play(t)', 'onTap: () => unawaited(_play(t))')
          home.write_text(s)

          main = Path('lib/main.dart')
          m = main.read_text()
          if "features/polish/premium_archive_home_screen.dart" not in m:
            m = m.replace(
              "import 'features/polish/archive_style_screens.dart';",
              "import 'features/polish/archive_style_screens.dart';\nimport 'features/polish/premium_archive_home_screen.dart';",
            )
          m = m.replace('ArchiveStyleHomeScreen(\n', 'PremiumArchiveHomeScreen(\n', 1)
          main.write_text(m)
          PY

      - name: Format Home integration
        run: dart format lib/features/polish/premium_archive_home_screen.dart lib/main.dart

      - name: Commit Home integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/polish/premium_archive_home_screen.dart lib/main.dart
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
          else
            git commit -m "feat(home): integrate ArchiveTune-style Home screen [skip ci]"
            git push origin HEAD:feature/home-archivetune-v2
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6G
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Validate artifacts
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab
          echo "Release APK: $(stat -c%s build/app/outputs/flutter-apk/app-release.apk) bytes"
          echo "Release AAB: $(stat -c%s build/app/outputs/bundle/release/app-release.aab) bytes"
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/bundle/release/app-release.aab

      - name: Upload Home build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-home-archivetune-v2
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
