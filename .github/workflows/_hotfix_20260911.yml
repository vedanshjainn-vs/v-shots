name: One-time V Shots playback hotfix

on:
  push:
    branches: [feat/production-upgrade]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: feat/production-upgrade
          fetch-depth: 0

      - name: Apply hotfix
        run: python3 scripts/apply_hotfix_20260911.py

      - name: Verify Dart formatting
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Format changed Dart file
        run: dart format lib/features/foryou/for_you_feed_screen.dart

      - name: Verify analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Remove one-time hotfix files
        run: |
          git rm scripts/apply_hotfix_20260911.py .github/workflows/_hotfix_20260911.yml

      - name: Commit and push hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/src/main/kotlin/com/vshots/live/VShotsBrowserPlatformView.kt lib/features/foryou/for_you_feed_screen.dart
          git diff --cached --check
          git commit -m 'fix(player): stabilize playback, discovery swipes and notification lifecycle'
          git push origin HEAD:feat/production-upgrade
