name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: flutter pub get
      - run: flutter build apk --split-per-abi
      - name: List APKs
        run: ls -lh build/app/outputs/flutter-apk/
      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
      - name: Upload ARM APK
        uses: actions/upload-artifact@v4
        with:
          name: v-shots-arm
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          tag_name: v${{ github.run_number }}
          name: V Shots v${{ github.run_number }}
          body: |
            ## V Shots APK
            
            ### Which APK?
            - **arm64** — Modern phones (2016+)
            - **arm** — Older phones
            
            ### Install
            1. Download correct APK
            2. Open File Manager
            3. Tap APK to install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
