plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.vshots.live"
    compileSdk 36

    defaultConfig {
        applicationId "com.vshots.live"
        minSdk 24
        targetSdk 36
        versionCode 45
        versionName "5.9.2"
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

flutter {
    source '../..'
}

// Unity LevelPlay mediation — current Android network adapters.
// The LevelPlay Flutter plugin provides the core LevelPlay SDK.
dependencies {
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    implementation 'com.google.android.gms:play-services-basement:18.3.0'

    // Unity Ads bidding demand.
    implementation 'com.unity3d.ads-mediation:unityads-adapter:5.12.0'
    implementation 'com.unity3d.ads:unity-ads:4.20.0'

    // Meta Audience Network bidding + native demand.
    // Current Unity LevelPlay Android docs list adapter 5.4.0 / Meta SDK 6.22.0.
    implementation 'com.unity3d.ads-mediation:facebook-adapter:5.4.0'
    implementation 'com.facebook.android:audience-network-sdk:6.22.0'
}
