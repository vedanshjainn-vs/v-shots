# Raise Gradle heap. The Debug build jetifies Flutter's large multi-ABI
# engine jars (armeabi_v7a_debug etc.) in :app:compileDebugKotlin, which can
# exhaust a 4G heap on resource-constrained CI runners (Java heap space).
# 6G gives ample headroom on a 16GB runner and keeps the build deterministic
# when release + AAB + debug run in one job sharing the Gradle daemon.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
