buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Unity all Android modules (app + plugins) on minSdk 24 — the app's own
// value — so no plugin androidTest variant declares a lower minSdk than a
// library it depends on (e.g. exifinterface needs 21, flutter_plugin_android_
// lifecycle needs 24), which otherwise breaks the androidTest APK manifest
// merge. Since :app is force-evaluated by evaluationDependsOn above, guard
// against already-evaluated projects (afterEvaluate on them would throw).
def _vshotsConfigureMinSdk = { p ->
    if (p.plugins.hasPlugin("com.android.library") || p.plugins.hasPlugin("com.android.application")) {
        p.android {
            defaultConfig {
                def m = minSdkVersion
                int cur = (m instanceof Integer) ? ((Integer) m).intValue() : (m != null ? m.getApiLevel() : 0)
                if (cur < 24) {
                    minSdkVersion 24
                }
            }
        }
    }
}
subprojects {
    if (project.state.executed) {
        _vshotsConfigureMinSdk(project)
    } else {
        project.afterEvaluate { p -> _vshotsConfigureMinSdk(p) }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
