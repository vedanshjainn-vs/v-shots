buildscript {
    ext.kotlin_version = '2.2.0'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// The release/debug app already uses minSdk 24, but some plugin androidTest
// variants (e.g. audio_service) declare minSdk 19, which conflicts with
// androidx.exifinterface:exifinterface:1.4.1 (minSdk 21) during androidTest
// APK build. Raise a floor of 21 only for modules below it; the app's minSdk
// 24 is left untouched.
subprojects {
    afterEvaluate { project ->
        if (project.plugins.hasPlugin("com.android.library") || project.plugins.hasPlugin("com.android.application")) {
            project.android {
                defaultConfig {
                    def m = minSdkVersion
                    int cur = (m instanceof Integer) ? ((Integer) m).intValue() : (m != null ? m.getApiLevel() : 0)
                    if (cur < 21) {
                        minSdkVersion 21
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
