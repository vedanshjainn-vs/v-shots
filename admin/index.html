<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>V Shots Home CMS</title>
<script type="module" src="./app.js"></script>
<style>
:root{color-scheme:dark}body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#0f1115;color:#fff}main{max-width:1100px;margin:auto;padding:28px 20px 60px}h1{margin-bottom:8px}.muted{color:#9da3af}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:#171a20;border:1px solid #292d36;border-radius:14px;padding:16px;margin:14px 0}button,input,select{padding:11px 12px;border-radius:9px;border:1px solid #333;background:#181b22;color:#fff;font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.auth{display:flex;gap:10px;align-items:center;margin:18px 0}.auth-user{color:#6ee7b7}.status{min-height:24px;margin:16px 0;color:#a7f3d0}.status[data-error="true"]{color:#fca5a5}.section{display:grid;grid-template-columns:1.2fr 1fr 170px 1.4fr 90px 110px auto auto auto auto;gap:9px;align-items:center}.visible{font-size:14px;white-space:nowrap}.visible input{accent-color:#7c3aed}.help{font-size:13px;color:#9da3af;margin-top:8px}@media(max-width:900px){.section{grid-template-columns:1fr 1fr}.section .value{grid-column:1/-1}.section .delete{grid-column:auto}}@media(max-width:600px){main{padding:20px 14px}.section{grid-template-columns:1fr}.section .value{grid-column:auto}}
</style>
</head>
<body>
<main>
<h1>V Shots Home CMS</h1>
<p class="muted">Control V Shots Home remotely. Publish changes without releasing a new app version.</p>
<div id="auth" class="auth"></div>
<div id="controls" class="row" style="display:none"><button id="add">+ Add Section</button><button id="publish">Publish</button><button id="reload">Reload</button></div>
<div id="status" class="status"></div>
<div id="sections"></div>
<p class="help">Changes are local until you press Publish. Only the authorized Google account can edit the CMS.</p>
</main>
</body>
</html>
