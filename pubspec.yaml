name: v_shots
description: V Shots - Music Streaming App
# Reconciled with android/app/build.gradle's real, actually-shipped
# versionName/versionCode (5.3.0 / 12) — this field had drifted to a
# stale 0.1.0+1 left over from the project's very first scaffold,
# confirmed during the read-only audit (docs/CURRENT_BASELINE.md
# Section 7/Top-10 fix list item #10). android/app/build.gradle
# hardcodes its own versionCode/versionName rather than reading
# `flutter.versionCode`/`flutter.versionName` from this file, so this
# change alone does not affect what gets shipped — it just stops this
# field from lying about the app's real version. Bump BOTH values
# together going forward (this file AND build.gradle) until/unless
# build.gradle is switched to read from here automatically.
version: 5.9.0+21
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  shimmer: ^3.0.0
  # Backend (see lib/core/backend/supabase_service.dart for wiring notes)
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  # Background playback / lock-screen controls (see
  # lib/core/audio/vshots_audio_handler.dart for wiring notes)
  audio_service: ^0.18.19
  # Local persistence for Liked Songs / Recently Played / Playlists /
  # taste-profile (see core/storage/local_library.dart) — previously
  # all in-memory only, wiped on every app restart.
  shared_preferences: ^2.5.5
  # HTTP client for the LRCLIB lyrics API (see
  # core/lyrics/lyrics_service.dart) and general small HTTP calls.
  http: ^1.6.0
  # For picking local audio files to import for guaranteed-legal,
  # zero-licensing-risk offline playback (see
  # features/library/local_import_service.dart).
  file_picker: ^11.0.2
  # Disk+memory image caching — replaces plain Image.network() calls
  # across the app (Home cards, Search results, For You feed, Player,
  # mini-player), which previously re-downloaded the same artwork from
  # scratch on every rebuild/rescroll. See core/theme/app_image.dart.
  cached_network_image: ^3.4.1
  # Native platform share sheet — used by the "More options" bottom
  # sheet (Player screen + For You feed) to share a track.
  #
  # Pinned to ^12.x, not the newest ^13.x: share_plus >=13.1.0 requires
  # win32 ^6.0.1, which conflicts with file_picker's win32 ^5.9.0
  # requirement (confirmed via a real `flutter pub get` version-solving
  # failure — file_picker is load-bearing for the app's existing local
  # audio import feature, so share_plus is the one pinned down instead).
  share_plus: ^12.0.2
  # Used by the real Help & Support screen (Phase 8 fix — see
  # lib/features/profile/settings_screen.dart) to open the actual
  # GitHub repo/issue tracker — was already present as a transitive
  # dependency (via share_plus), promoted to a direct dependency since
  # this app now calls it directly.
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  # Google AdMob (native ads) + Google UMP consent. Development uses the
  # official TEST ad unit IDs; production IDs are injected via secure config
  # (see lib/core/ads/ad_config.dart). See docs/legal/privacy_policy.md for
  # the advertising/consent disclosure.
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    # Real, existing legal doc files (see docs/legal/) — previously
    # written but never actually linked from the app anywhere
    # (ProfileScreen's "Privacy Policy"/"Terms of Service" rows had no
    # onTap at all). Bundled as assets so SettingsScreen (Phase 8 fix)
    # can render their real content instead of the app claiming they
    # exist while never showing them.
    - docs/legal/privacy_policy.md
    - docs/legal/terms_of_service.md
