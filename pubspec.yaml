name: v_shots
description: V Shots - Music Streaming App
# Reconciled with android/app/build.gradle's shipped release version.
version: 5.9.1+44
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  audio_service: ^0.18.19
  shared_preferences: ^2.5.5
  http: ^1.6.0
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.13.0
  google_mobile_ads: ^5.3.0
  unity_levelplay_mediation: ^9.2.0
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0
  in_app_update: ^4.2.3
  app_links: ^6.3.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0


dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  # path_provider_android 2.3.0+ migrated from a plain MethodChannel plugin to a
  # jni/jnigen FFI bridge (depends on the `jni` + `jni_flutter` packages). The
  # generated bindings call into `libdartjni.so` (JClass.forName / FindClass)
  # during Dart plugin class registration, BEFORE the Flutter engine has set up
  # the native JNI context, aborting the process on device with
  #   "JNI is not initialized ... before 'main()' ..."  (SIGSEGV, fault addr 0x0).
  # That is the cold-launch death on the Redmi/MIUI handset. Pin the last
  # pre-jni release (2.2.23) so path_provider uses the classic platform channel
  # again. It fully satisfies path_provider 2.1.6 (`^2.2.5`).
  path_provider_android: 2.2.23

flutter:
  uses-material-design: true
  assets:
    - .env
    - docs/legal/privacy_policy.md
    - docs/legal/terms_of_service.md
