name: v_shots
description: V Shots - Music Streaming App
version: 5.8.0+20
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.39
  shimmer: ^3.0.0
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1
  audio_service: ^0.18.19
  shared_preferences: ^2.5.5
  http: ^1.6.0
  file_picker: ^11.0.2
  cached_network_image: ^3.4.1
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  flutter_inappwebview: ^6.1.5
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
    - docs/legal/privacy_policy.md
    - docs/legal/terms_of_service.md
