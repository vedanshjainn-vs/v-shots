name: v_shots
description: V Shots - Music Streaming App
version: 0.1.0+1
publish_to: "none"

environment:
  # Bumped for google_sign_in ^7.2.0, which requires Dart >=3.7 (Flutter
  # >=3.29). CI now uses Flutter 3.44.0 (see .github/workflows/build.yml).
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  youtube_explode_dart: ^2.2.2
  just_audio: ^0.9.39
  shimmer: ^3.0.0
  # Backend (see lib/core/backend/supabase_service.dart for wiring notes)
  supabase_flutter: ^2.12.4
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - .env
